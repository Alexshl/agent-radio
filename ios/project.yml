name: AgentRadio
options:
  bundleIdPrefix: com.example.agentradio   # PLACEHOLDER: set your own prefix (or change the bundle id in Xcode)
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: uk
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AgentRadio:
    type: application
    platform: iOS
    sources:
      - AgentRadio
    settings:
      base:
        # PLACEHOLDER bundle id: must be unique for your Apple ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.agentradio.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # DEVELOPMENT_TEAM is set in Xcode (Signing & Capabilities).
    info:
      path: AgentRadio/Info.plist
      properties:
        CFBundleDisplayName: agent-radio
        CFBundleDevelopmentRegion: uk
        CFBundleLocalizations: [uk, en]
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          # Lets AVPlayer stream from plain http hosts too (https works without it).
          NSAllowsArbitraryLoadsForMedia: true
  AgentRadioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AgentRadioTests
    dependencies:
      - target: AgentRadio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.agentradio.tests
schemes:
  AgentRadio:
    build:
      targets:
        AgentRadio: all
        AgentRadioTests: [test]
    test:
      targets:
        - AgentRadioTests
